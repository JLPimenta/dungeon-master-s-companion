<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Marca animada</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<!-- Marca animada: o losango se solta da capa → o livro recua → o losango sobe como d20 → o livro abre (B) → fecha → o dado desce → o livro volta → assenta (A) -->
<div style="width: 100%; height: 100%; box-sizing: border-box; background: {{K}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: {{gap}}px; font-family: 'Crimson Text', Georgia, serif; color: {{text}}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 64 64" role="img" aria-label="{{aria}}" style="display: block; flex-shrink: 0">
<g transform="{{f.bookT}}">
<polygon points="{{f.pages}}" fill="{{F}}" stroke="{{F}}" stroke-width="6" stroke-linejoin="round"></polygon>
<polygon points="{{f.spine}}" fill="{{F}}" stroke="{{F}}" stroke-width="6" stroke-linejoin="round" opacity="{{f.spineOp}}"></polygon>
<polygon points="{{f.cover}}" fill="{{K}}" stroke="{{K}}" stroke-width="11" stroke-linejoin="round"></polygon>
<polygon points="{{f.cover}}" fill="{{F}}" stroke="{{F}}" stroke-width="6" stroke-linejoin="round"></polygon>
<g opacity="{{f.strapOp}}"><rect x="42.5" y="22" width="15" height="13" rx="3" fill="{{K}}"></rect><rect x="44" y="23.5" width="12" height="10" rx="2" fill="{{F}}"></rect></g>
<polygon points="{{f.socket}}" fill="{{K}}" opacity="{{f.socketOp}}"></polygon>
</g>
<polygon points="{{f.gemHalo}}" fill="{{K}}"></polygon>
<polygon points="{{f.gemBody}}" fill="{{F}}" opacity="{{f.gemOp}}"></polygon>
<g transform="{{f.triT}}" opacity="{{f.triOp}}"><polygon points="0,-6.5 6,4 -6,4" fill="none" stroke="{{K}}" stroke-width="2" stroke-linejoin="round"></polygon><path d="M0 -6.5 L0 -11 M6 4 L9.5 5.5 M-6 4 L-9.5 5.5" stroke="{{K}}" stroke-width="2"></path></g>
</svg>
<sc-if value="{{hasLabel}}" hint-placeholder-val="{{ true }}"><span role="status" style="font-size: {{labelSize}}px; color: {{muted}}; font-style: italic">{{label}}</span></sc-if>
<sc-if value="{{showPhase}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Cinzel', serif; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: {{muted}}">{{phaseUp}}</span></sc-if>
<sc-if value="{{controls}}" hint-placeholder-val="{{ false }}">
<div style="width: min(520px, 90%); margin-top: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid #2A2E38; background: #1A1F28; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{togglePlay}}" aria-label="{{playAria}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px; border: 1px solid #3A3424; background: transparent; color: #E6DCC8; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg></sc-if>
</button>
<input type="range" min="0" max="1000" step="1" value="{{scrub}}" onInput="{{onScrub}}" aria-label="Posição na animação" style="flex: 1; accent-color: #D9A62E">
<span style="width: 120px; flex-shrink: 0; text-align: right; font-size: 15px; color: #E6DCC8">{{f.phase}}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="font-size: 14px; color: #A0977F">Ciclo de {{cycleS}} s</span>
<div style="flex: 1"></div>
<button type="button" onClick="{{toggleReduced}}" aria-pressed="{{reducedAria}}" style="{{reducedStyle}}">Movimento reduzido</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"size":{"editor":"string","default":"200"},"label":{"editor":"string","default":"Abrindo o grimório…"},"frame":{"editor":"string","default":""},"controls":{"editor":"enum","options":["","1"],"default":""},"reduced":{"editor":"enum","options":["","1"],"default":""},"$preview":{"width":600,"height":500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Grimório · marca e animação de carregamento (grade 64 × 64).
    // Fonte única: o quadro 0 é exatamente a marca estática.
    // Formas do livro são polígonos recuados 3 unidades e desenhados com traço 6 (cantos com raio 3).
    //
    // Coreografia (o losango se solta ANTES de o livro abrir e nunca cruza o livro):
    //  1. o losango se levanta da capa, no lugar; o engaste se fecha por baixo dele
    //  2. o livro fechado recua (encolhe para a base) por baixo do losango, que fica parado
    //  3. o losango sobe e vira o d20
    //  4. o livro abre embaixo do dado, crescendo até o tamanho do livro aberto
    //  5. pausa · 6. o livro fecha e recua · 7. o dado desce e vira losango, pairando
    //  8. o livro volta ao tamanho por baixo dele · 9. o losango assenta
    this.G = (() => {
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const seg = (u, a, b) => clamp((u - a) / (b - a));
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);
      const lerp = (a, b, t) => a + (b - a) * t;
      const L = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t)];
      const pts = (arr) => arr.map((p) => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');

      const T = {
        popA: 0.04, popB: 0.11,       // losango se levanta da capa (fica pairando)
        backA: 0.11, backB: 0.23,     // o livro fechado recua por baixo do losango parado
        riseA: 0.21, riseB: 0.37,     // o losango sobe e vira d20
        openA: 0.37, openB: 0.55,     // livro abre embaixo do dado
        closeA: 0.65, closeB: 0.79,   // livro fecha
        fallA: 0.79, fallB: 0.89,     // dado desce e volta a ser losango, pairando
        fwdA: 0.87, fwdB: 0.96,       // o livro volta ao tamanho por baixo dele
        seatA: 0.94, seatB: 0.99      // losango assenta no engaste
      };
      const PHASES = [[0, 'Fechado'], [T.popA, 'Losango se solta'], [T.backA, 'Livro recua'], [T.riseA, 'Dado subindo'], [T.openA, 'Abrindo'], [T.openB, 'Aberto'],
        [T.closeA, 'Fechando'], [T.fallA, 'Dado descendo'], [T.fwdA, 'Livro volta'], [T.seatA, 'Assentando'], [T.seatB, 'Fechado']];

      const COVER_C = [[24.5, 9], [48, 9], [48, 48], [24.5, 48]];   // dobradiça-topo, livre-topo, livre-base, dobradiça-base
      const COVER_O = [[28, 35], [9, 30], [9, 48.5], [28, 54]];
      const PAGES_C = [[24.5, 9], [48, 9], [48, 55], [24.5, 55]];
      const PAGES_O = [[36, 35], [55, 30], [55, 48.5], [36, 54]];
      const SPINE_C = [[16, 9], [16, 9], [16, 55], [16, 55]];
      const SPINE_O = [[32, 35], [32, 35], [32, 54], [32, 54]];
      const STRAP = { halo: [42.5, 22, 15, 13, 3], body: [44, 23.5, 12, 10, 2] };
      const SEAT = [32, 28.5], GEM_R = 4.25, SOCKET_R = 8, D20 = { x: 32, y: 15, r: 11 };
      const SMALL = 0.48, ANCHOR = [32, 58];   // tamanho do livro recuado e ponto fixo (base, centro)
      const HEX = [-90, -30, 30, 90, 150, 210], DIA = [-90, 0, 0, 90, 180, 180];

      function frame(u, opts) {
        opts = opts || {};
        if (opts.reduced) u = 0;
        const pop = ease(seg(u, T.popA, T.popB)) - ease(seg(u, T.seatA, T.seatB));     // 1 = losango solto
        const rise = ease(seg(u, T.riseA, T.riseB)) - ease(seg(u, T.fallA, T.fallB));  // 1 = d20 no alto
        const back = ease(seg(u, T.backA, T.backB)) - ease(seg(u, T.fwdA, T.fwdB));    // 1 = livro recuado
        const b = ease(seg(u, T.openA, T.openB)) - ease(seg(u, T.closeA, T.closeB));   // 1 = livro aberto

        // Livro (coordenadas próprias) e a transformação que o recua
        const lift = 4 * Math.sin(Math.PI * b);
        const cover = COVER_C.map((p, i) => { const q = L(p, COVER_O[i], b); if (i === 1 || i === 2) q[1] -= lift; return q; });
        const pages = PAGES_C.map((p, i) => L(p, PAGES_O[i], b));
        const spine = SPINE_C.map((p, i) => L(p, SPINE_O[i], b));
        const shiftX = -2.5 * (1 - b);
        const s = lerp(lerp(1, SMALL, back), 1, b);
        const bookT = 'translate(' + ANCHOR[0] + ' ' + ANCHOR[1] + ') scale(' + s.toFixed(4) + ') translate(' + (-ANCHOR[0] + shiftX).toFixed(3) + ' ' + (-ANCHOR[1]) + ')';

        // Engaste (dentro do livro): fecha quando o losango se solta
        const sk = SOCKET_R * (1 - pop);
        const socket = DIA.map((d) => { const a = d * Math.PI / 180; return [SEAT[0] + sk * Math.cos(a), SEAT[1] + sk * Math.sin(a)]; });

        // Losango / d20 (coordenadas do quadro). Sai do assento e fica pairando no mesmo ponto
        // enquanto o livro recua; só então sobe. O livro nunca passa por cima dele.
        const hover = [SEAT[0] - 2.5, SEAT[1]];
        const cx = lerp(hover[0], D20.x, ease(rise)), cy = lerp(hover[1], D20.y, ease(rise));
        const r = lerp(GEM_R * (1 + 0.12 * pop), D20.r, ease(rise)), rot = 180 * ease(rise);
        const shape = (rad) => HEX.map((h, i) => {
          const a = (lerp(DIA[i], h, ease(rise)) + rot) * Math.PI / 180;
          return [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
        });
        const out = 1.6 * pop;

        let gemOp = 1;
        if (opts.reduced) gemOp = 0.45 + 0.55 * (0.5 + 0.5 * Math.cos((opts.ms || 0) / 1600 * 2 * Math.PI));
        let phase = 'Fechado';
        PHASES.forEach(([at, name]) => { if (u >= at) phase = name; });
        return {
          bookT,
          cover: pts(cover), pages: pts(pages), spine: pts(spine),
          spineOp: clamp(1 - b * 2.2).toFixed(3), strapOp: clamp(1 - b / 0.12).toFixed(3),
          socket: pts(socket), socketOp: sk > 0.05 ? '1' : '0',
          gemHalo: pts(shape(r + out)), gemBody: pts(shape(r)), gemOp: gemOp.toFixed(3),
          triOp: clamp((rise - 0.8) / 0.2).toFixed(3), triT: 'translate(' + cx.toFixed(2) + ' ' + cy.toFixed(2) + ')',
          phase: opts.reduced ? 'Movimento reduzido' : phase
        };
      }
      return { frame, T, STRAP };
    })();

    const fixed = props.frame !== undefined && props.frame !== '';
    this.CYCLE = 4200;
    this.state = { playing: !fixed, u: fixed ? Number(props.frame) : 0, ms: 0, reduced: props.reduced === '1' };
    this._start = null;
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); this._raf = null; }
  loop() {
    if (this._raf) return;
    const tick = (now) => {
      this._raf = null;
      if (!this.state.playing && !this.state.reduced) return;
      if (this._start === null) this._start = now - this.state.u * this.CYCLE;
      const el = now - this._start;
      this.setState({ u: this.state.reduced ? this.state.u : (el % this.CYCLE) / this.CYCLE, ms: el });
      this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }
  renderVals() {
    const st = this.state, p = this.props;
    const dark = (p.theme || 'dark') !== 'light';
    const fixed = p.frame !== undefined && p.frame !== '';
    if (!fixed && (st.playing || st.reduced)) this.loop();
    const size = Number(p.size) || 200;
    const f = this.G.frame(st.u, { reduced: st.reduced, ms: st.ms });
    const label = p.label === undefined ? 'Abrindo o grimório…' : p.label;
    return {
      f, size, K: dark ? '#12151B' : '#F4EFE4', F: dark ? '#D9A62E' : '#8A6510',
      text: dark ? '#E6DCC8' : '#252B37', muted: dark ? '#A0977F' : '#5F6879',
      gap: Math.round(size * 0.12), labelSize: size >= 160 ? 20 : 17,
      aria: label || 'Carregando', hasLabel: !!label, label,
      showPhase: fixed, phaseUp: f.phase.toUpperCase(),
      controls: p.controls === '1', playing: st.playing, paused: !st.playing,
      playAria: st.playing ? 'Pausar' : 'Reproduzir',
      togglePlay: () => { this._start = null; this.setState({ playing: !st.playing, reduced: false }); },
      scrub: Math.round(st.u * 1000),
      onScrub: (e) => { this._start = null; this.setState({ playing: false, reduced: false, u: Number(e.target.value) / 1000 }); },
      cycleS: (this.CYCLE / 1000).toFixed(1).replace('.', ','),
      reducedAria: st.reduced ? 'true' : 'false',
      toggleReduced: () => { this._start = null; this.setState({ reduced: !st.reduced, playing: st.reduced, u: 0 }); },
      reducedStyle: 'height: 40px; padding: 0 14px; border-radius: 8px; font: inherit; font-size: 15px; cursor: pointer; ' + (st.reduced ? 'border: 1px solid #D9A62E; background: #2B2414; color: #EBC15A' : 'border: 1px solid #3A3424; background: transparent; color: #E6DCC8')
    };
  }
}
</script>
</body>
</html>
