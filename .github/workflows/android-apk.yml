name: Android APK

on:
  push:
    branches: [feature/mobile-android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Conferir variáveis públicas
        run: |
          missing=0
          for name in VITE_RECAPTCHA_SITE_KEY VITE_GOOGLE_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Crie a variável $name em Settings > Secrets and variables > Actions > Variables (mesmo valor do site em produção)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: npm test

      - name: Gerar o site e copiar para o projeto Android
        run: npm run android:sync

      - name: Preparar chave de assinatura
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/grimorio.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/grimorio.jks" >> "$GITHUB_ENV"

      - name: Compilar o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Mostrar a assinatura do APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=android/app/build/outputs/apk/release/app-release.apk
          {
            echo "### APK ${ANDROID_VERSION_NAME}"
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "Assinado com a chave fixa do app."
            else
              echo "**Chave de debug**: serve só para teste. O login com Google não funciona e cada execução exige desinstalar a versão anterior."
            fi
            echo '```'
            "$apksigner" verify --print-certs "$apk" | grep -E "SHA-1|SHA-256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: grimorio-${{ env.ANDROID_VERSION_NAME }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
